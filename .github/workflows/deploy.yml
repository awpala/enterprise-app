name: deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      target:
        description: Cloud deployment target
        required: true
        type: choice
        options:
          - both
          - azure
          - aws
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  context:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      azure_enabled: ${{ steps.context.outputs.azure_enabled }}
      aws_enabled: ${{ steps.context.outputs.aws_enabled }}
      api_changed: ${{ steps.context.outputs.api_changed }}
      data_engine_changed: ${{ steps.context.outputs.data_engine_changed }}
      ui_changed: ${{ steps.context.outputs.ui_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select targets and detect changes
        id: context
        env:
          CONFIGURED_TARGETS: ${{ vars.DEPLOYMENT_TARGETS }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            selected="${MANUAL_TARGET}"
            environment="${MANUAL_ENVIRONMENT}"
          else
            selected="${CONFIGURED_TARGETS}"
            environment=$([[ "${GITHUB_REF}" == "refs/heads/main" ]] && echo production || echo dev)
          fi

          if [[ -z "$selected" ]]; then
            echo "DEPLOYMENT_TARGETS must explicitly be azure, aws, or both for push deployments." >&2
            exit 2
          fi

          azure_enabled=false
          aws_enabled=false
          case "${selected,,}" in
            azure) azure_enabled=true ;;
            aws) aws_enabled=true ;;
            both|azure,aws|aws,azure) azure_enabled=true; aws_enabled=true ;;
            *) echo "Unsupported deployment target selection: $selected" >&2; exit 2 ;;
          esac

          api_changed=true
          data_engine_changed=true
          ui_changed=true
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              base="${GITHUB_SHA}~1"
            else
              base="origin/main"
            fi
            changed=$(git diff --name-only "$base" HEAD -- 2>/dev/null || true)
            api_changed=$(grep -q '^api/' <<<"$changed" && echo true || echo false)
            data_engine_changed=$(grep -q '^data-engine/' <<<"$changed" && echo true || echo false)
            ui_changed=$(grep -q '^ui/' <<<"$changed" && echo true || echo false)
          fi

          {
            echo "environment=$environment"
            echo "azure_enabled=$azure_enabled"
            echo "aws_enabled=$aws_enabled"
            echo "api_changed=$api_changed"
            echo "data_engine_changed=$data_engine_changed"
            echo "ui_changed=$ui_changed"
          } >> "$GITHUB_OUTPUT"

  deploy-azure:
    name: Azure
    if: needs.context.outputs.azure_enabled == 'true'
    needs: context
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: ${{ needs.context.outputs.environment }}
      api_changed: ${{ needs.context.outputs.api_changed }}
      data_engine_changed: ${{ needs.context.outputs.data_engine_changed }}
      ui_changed: ${{ needs.context.outputs.ui_changed }}
    secrets: inherit

  deploy-aws:
    name: AWS
    if: needs.context.outputs.aws_enabled == 'true'
    needs: context
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ needs.context.outputs.environment }}
      api_changed: ${{ needs.context.outputs.api_changed }}
      data_engine_changed: ${{ needs.context.outputs.data_engine_changed }}
      ui_changed: ${{ needs.context.outputs.ui_changed }}
    secrets: inherit
