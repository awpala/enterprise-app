name: deploy

on:
  push:
    branches:
      - "**"
    paths:
      - "api/**"
      - "data-engine/**"
      - "ui/**"
      - "infra/aws/**/*.tf"
      - "infra/aws/**/*.tfvars"
      - "infra/aws/**/*.tftpl"
      - "infra/aws/**/.terraform.lock.hcl"
      - "infra/azure/**/*.tf"
      - "infra/azure/**/*.tfvars"
      - "infra/azure/**/*.tftpl"
      - "infra/azure/**/.terraform.lock.hcl"
      - "infra/azure/modules/observability/workbooks/*.json"
      - ".github/workflows/deploy-aws.yml"
      - ".github/workflows/deploy-azure.yml"
      - ".github/scripts/aws-build-and-push-images.sh"
      - ".github/scripts/aws-clean-images.sh"
      - ".github/scripts/aws-list-active-images.sh"
      - ".github/scripts/aws-run-migrations-task.sh"
      - ".github/scripts/aws-verify-active-images.sh"
      - ".github/scripts/azure-build-and-push-images.sh"
      - ".github/scripts/azure-clean-images.sh"
      - ".github/scripts/azure-run-migrations-job.sh"
      - ".github/scripts/compute-context.sh"
      - ".github/scripts/resolve-deployment-context.sh"
      - ".github/scripts/smoke-test.sh"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: Cloud deployment target
        required: true
        type: choice
        options:
          - both
          - azure
          - aws
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  context:
    name: Resolve deployment context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      azure_enabled: ${{ steps.context.outputs.azure_enabled }}
      aws_enabled: ${{ steps.context.outputs.aws_enabled }}
      api_changed: ${{ steps.context.outputs.api_changed }}
      data_engine_changed: ${{ steps.context.outputs.data_engine_changed }}
      ui_changed: ${{ steps.context.outputs.ui_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select targets and detect changes
        id: context
        env:
          CONFIGURED_TARGETS: ${{ vars.DEPLOYMENT_TARGETS }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/resolve-deployment-context.sh

  deploy-azure:
    name: Azure
    if: needs.context.outputs.azure_enabled == 'true'
    needs: context
    uses: ./.github/workflows/deploy-azure.yml
    with:
      environment: ${{ needs.context.outputs.environment }}
      api_changed: ${{ needs.context.outputs.api_changed }}
      data_engine_changed: ${{ needs.context.outputs.data_engine_changed }}
      ui_changed: ${{ needs.context.outputs.ui_changed }}
    secrets: inherit

  deploy-aws:
    name: AWS
    if: needs.context.outputs.aws_enabled == 'true'
    needs: context
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: ${{ needs.context.outputs.environment }}
      api_changed: ${{ needs.context.outputs.api_changed }}
      data_engine_changed: ${{ needs.context.outputs.data_engine_changed }}
      ui_changed: ${{ needs.context.outputs.ui_changed }}
    secrets: inherit
