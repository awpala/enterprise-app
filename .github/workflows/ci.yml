name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore .NET packages
        run: dotnet restore api/EA.sln

      - name: Run API unit tests
        run: dotnet test api/tests/EA.Api.Tests/ --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run UI tests
        working-directory: ui
        run: npm test

      - name: Lint and build UI
        working-directory: ui
        run: npm run lint && npm run build

  integration-tests:
    name: Integration tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore .NET packages
        run: dotnet restore api/EA.sln

      - name: Run API integration tests
        run: dotnet test api/tests/EA.Api.IntegrationTests/ --configuration Release --no-restore

  infrastructure-validation:
    name: Terraform (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [azure, aws]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Check formatting
        run: terraform fmt -check -recursive "infra/${{ matrix.target }}"

      - name: Validate application root
        run: |
          terraform -chdir="infra/${{ matrix.target }}" init -backend=false
          terraform -chdir="infra/${{ matrix.target }}" validate

      - name: Test AWS secret readiness contract
        if: matrix.target == 'aws'
        run: |
          terraform -chdir="infra/aws/modules/secrets-manager" init -backend=false
          terraform -chdir="infra/aws/modules/secrets-manager" test

      - name: Validate bootstrap root
        run: |
          terraform -chdir="infra/${{ matrix.target }}/bootstrap" init -backend=false
          terraform -chdir="infra/${{ matrix.target }}/bootstrap" validate

  container-builds:
    name: Production containers and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and exercise the independent production stack
        run: python3 .github/scripts/check-coolify-stack.py

  delivery-script-validation:
    name: Delivery script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell adapters
        run: |
          for script in .github/scripts/*.sh .github/scripts/tests/*.sh infra/scripts/*.sh docs/runbooks/scripts/*.sh deploy/coolify/*/*.sh; do
            bash -n "$script"
          done
          bash .github/scripts/tests/aws-image-retention.test.sh
          bash .github/scripts/tests/deployment-context.test.sh
