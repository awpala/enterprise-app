[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-data-engine"
version = "0.1.0"
description = "Python data engine for numerical computations, consuming and producing RabbitMQ messages."
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "standard"
